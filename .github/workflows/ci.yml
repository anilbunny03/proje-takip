name: Tests and release package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TRACKER_TEST_TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript tests
        run: node --test tests/branding.test.cjs tests/core.test.cjs
      - name: Python and package tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Build portable ZIP
        run: python -B tools/package.py
      - name: Keep portable ZIP
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Proje-Takip-Uygulamasi
          path: dist/Proje-Takip-Uygulamasi.zip
          if-no-files-found: error
